[mqtt]
broker = "localhost"
port = 1883
keepalive = 60

[sensor]
topic_raw = "training/sensors/pressure/raw"
publish_interval = 1.0
mean = 47.0
std = 6.0
sensor_id = "pressure-01"
unit = "bar"

[stats]
topic_stats = "training/sensors/pressure/stats"
window_size = 10
mu0 = 50.0
alpha = 0.05
correction_method = "raw"   # "raw" | "bonferroni" | "sidak" | "holm" | "bh"
p_history_size = 1000

[alarm]
topic_alarm = "training/alarms/pressure"
threshold = 50.0
hysteresis = 1.0
persistence_n = 3
correction_method = "raw"

[database]
url = "postgresql+psycopg://mcc:mcc_dev_password@localhost:5432/mcc"
echo = false